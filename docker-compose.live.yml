# Live host: UI + API on one port. Offline desktop app is unchanged.
#   docker compose -f docker-compose.yml -f docker-compose.live.yml up -d --build
#
# Open http://localhost:3001  (or your VPS public URL)

services:
  db:
    ports: []

  web:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://chainwatch:chainwatch@db:5432/chainwatch
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-*}
      FRONTEND_DIST: /app/frontend/dist
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
